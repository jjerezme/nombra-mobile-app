name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name and target (Gitflow)
        run: |
          head="${{ github.head_ref }}"; base="${{ github.base_ref }}"
          case "$base" in
            develop) re='^(feature|bugfix)/.+|^(release|hotfix)/.+|^master$' ;;
            master)  re='^(release|hotfix)/.+|^develop$' ;;
          esac
          echo "$head" | grep -Eq "$re" || { echo "Branch '$head' not allowed into '$base'"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # @jujeme/mobile-tools (local build script) is an optional dependency from a private repo: CI cannot fetch it and
      # does not need it, so npm skips it.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check styles
        run: npm run check:styles
      - name: Test
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor
