name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name and target (Gitflow)
        run: |
          head="${{ github.head_ref }}"; base="${{ github.base_ref }}"
          case "$base" in
            develop) re='^(feature|bugfix)/.+|^(release|hotfix)/.+|^master$' ;;
            master)  re='^(release|hotfix)/.+|^develop$' ;;
          esac
          echo "$head" | grep -Eq "$re" || { echo "Branch '$head' not allowed into '$base'"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test scripts
      - name: Analyze
        run: flutter analyze
      - name: Check styles
        run: dart run scripts/check_styles.dart
      - name: Test
        run: flutter test
